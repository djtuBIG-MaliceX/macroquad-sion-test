# Browser builds use wasm32-unknown-unknown (the only target macroquad/miniquad
# actually supports): linking goes through the built-in rust-lld and needs no
# external toolchain. The old wasm32-unknown-emscripten linker config produced
# a binary that miniquad's gl.js runtime cannot host (wasi/emscripten imports,
# no memory-growth glue).
#
# Host-function imports are the whole point of this target: `_miniquad_*` come
# from gl.js and `audio_*` from the macroquad_audio plugin in web/index.html,
# none exist at link time, so rust-lld must not abort on undefined symbols.
[target.wasm32-unknown-unknown]
rustflags = ["-C", "link-args=--allow-undefined"]
