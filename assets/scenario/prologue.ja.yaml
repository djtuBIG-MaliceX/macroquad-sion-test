# Prologue (Japanese) — locale-suffixed scenario picked up when the active
# language is Japanese; every other locale falls back to prologue.yaml.
# Dialogue here is literal Japanese copy (each locale's YAML carries its
# own translated lines), and this variant stages them with its own pacing
# and extra effects, so a locale can re-choreograph the scene, not just
# re-voice it.

commands:
  - image: { file: scene, appear: fade, seconds: 0.8 }

  - music: assets/audio/options_theme.mml
    # (same song; any registered SiMML/.mid/.ogg/.wav path works here)

  - dialog:
      speaker: アリア
      text: 塔の鐘が止まったのは、夕暮れ……

  - wait: 0.5
  - shake: { strength: 6, seconds: 0.8 }
  - sfx: assets/sfx/confirm.mml

  # MIDI demo: General MIDI SMF rendered live on reserved libSiON tracks.
  # As an `sfx:` it plays once over the theme that is already running.
  - sfx: assets/voice/furina_meets_link.mid

  - dialog:
      speaker: アリア
      text: 古い正門まで、付いてきてくれる？

  - animate: { target: scene, to: [560, 180], seconds: 1.6 }
  - wait: 2.0

  - next