# Prologue — demo scenario for the YAML scripting engine.
#
# The active locale picks `prologue.<locale>.yaml` when present (e.g.
# `prologue.ja.yaml`) and falls back to this default (English) file.
# Dialogue `speaker`/`text` are literal copy carried by this file —
# each locale's YAML holds its own translated lines, and the runner
# reads them straight out of the script (no assets/i18n/*.loc keys).
#
# Commands run top to bottom:
#   dialog: {speaker, text}        stage a line; waits for Enter/Z to advance
#   music:  <path|{file}>          switch song (SiMML / .mid / .ogg / .wav;
#                                  .mp3 decodes in browsers only). Restarting
#                                  only happens when the path actually changes
#   sfx:    <path|{file, beats}>   one-shot effect (same formats; a .mid plays
#                                  its whole length on reserved tracks *over*
#                                  whatever music is playing - `beats` only
#                                  bounds MML cues)
#   image:  <path|{file, name, appear, seconds, x, y, w, h}>
#                                  `scene` = generated placeholder backdrop;
#                                  appear: fade (default) | instant
#   animate: {target, to: [x,y], seconds}   slide an image (default: last)
#   shake:  <seconds|{strength, seconds}>   camera shake in virtual pixels
#   wait:   <seconds>              silent delay
#   next                           end the scenario (back to the title menu)

commands:
  - image: { file: scene, appear: instant }

  # starts the title theme (or keeps it running untouched if it is
  # already the current track — no restart on a same-path switch)
  - music: assets/audio/options_theme.mml

  - sfx: assets/sfx/confirm.mml

  # sampled SFX bus (macroquad): .ogg/.wav native+web, .mp3 browser-only
  - sfx: assets/sfx/voice_cue.ogg

  - dialog:
      speaker: Aria
      text: The tower bells stopped ringing at dusk...

  - wait: 0.35
  - shake: { strength: 9, seconds: 0.5 }

  # MIDI demo: General MIDI SMF rendered live on reserved libSiON
  # tracks (GM presets, per-channel pitch bend + expression). As an `sfx:`
  # it plays once *on top of* the theme that is already running, at the SFX
  # level - a voice-act cue rather than a music-bus takeover.
  - sfx: assets/voice/furina_meets_link.mid

  - dialog:
      speaker: Aria
      text: Will you walk with me to the old gate?

  - animate: { target: scene, to: [640, 150], seconds: 1.2 }
  - wait: 6.0

  - next