<body tabindex="-1">
<canvas id="glcanvas" tabindex="0"></canvas>
<div id="boot">loading wasm…<small id="bootmsg"></small></div>

<!-- miniquad/macroquad JS bundle (gl.js from the matching miniquad crate):
     canvas + WebGL host functions, event plumbing, asset XHR FS. It also
     defines the `env` imports (incl. now()) that libSiON-rs uses for its
     wasm seed/tick clocks. -->
<script src="js/mq_js_bundle.js"></script>

<!-- The binary's `env` imports are gl.js functions plus the ten `audio_*`
     host calls quad-snd (macroquad's "audio" feature) declares for wasm.
     gl.js 0.4.x does NOT ship them — stubbing instead of linking would make
     sound loading poll forever. The plugin below is the supported extension
     point (miniquad_add_plugin), filling env before the module instantiates. -->

<script id="macroquad-audio-plugin">
"use strict";
// ---------------------------------------------------------------------------
// WebAudio backend for quad-snd's wasm imports: decodes wav/ogg/mp3 (whatever
// the browser can) with decodeAudioData, plays through BufferSource chains.
// Gain model mirrors quad-snd: per-Sound multiplier x per-playback volume, so
// Rust's set_sound_volume sweeps every live instance of an asset at once.
// ---------------------------------------------------------------------------
(() => {
  const sources = new Map();    // id -> { buffer, failed, baseVol, playbacks:Set, pending:[] }
  const playbacks = new Map();  // id -> { srcId, node, vol }
  let audioCtx = null, outBus = null;
  let srcSeq = 1, pbSeq = 1;

  function ensure() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC({ latencyHint: "interactive" });
      outBus = audioCtx.createGain();
      outBus.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  }

  function stopPlayback(pbId) {
    const pb = playbacks.get(pbId);
    if (!pb) return;
    try { pb.src && pb.src.stop(); } catch (e) { /* already ended */ }
    try { pb.node && pb.node.disconnect(); } catch (e) {}
    playbacks.delete(pbId);
    const src = sources.get(pb.srcId);
    if (src) src.playbacks.delete(pbId);
  }

  function begin(entry, pbId) {
    const pb = playbacks.get(pbId);
    if (!pb || !entry.buffer) return;         // failed decode stays silent
    const node = audioCtx.createGain();
    node.gain.value = pb.vol * entry.baseVol;
    node.connect(outBus);
    const src = audioCtx.createBufferSource();
    src.buffer = entry.buffer;
    src.loop = pb.loop;
    src.connect(node);
    src.onended = (ev) => { if (ev.target === src && playbacks.has(pbId)) stopPlayback(pbId); };
    src.start();
    pb.src = src;
  }

  const host = {
    audio_init() { ensure(); },

    audio_add_buffer(ptr, len) {
      ensure();
      const id = srcSeq++;
      // copy out immediately: the heap reallocates when it grows
      const bytes = new Uint8Array(wasm_memory.buffer, ptr >>> 0, len >>> 0).slice();
      const entry = { buffer: null, failed: false, baseVol: 1, playbacks: new Set() };
      sources.set(id, entry);
      audioCtx.decodeAudioData(bytes.buffer).then(
        (buf) => { entry.buffer = buf; },
        (e) => {
          // report "loaded" so macroquad's loader loop terminates; play is a no-op
          entry.failed = true;
          console.warn("audio decode failed:", e);
        }
      );
      return id;
    },

    audio_source_is_loaded(id) {
      const s = sources.get(id);
      return !!s && (s.buffer !== null || s.failed);
    },

    audio_play_buffer(id, volume, repeat) {
      ensure();
      const pbId = pbSeq++;
      const entry = sources.get(id);
      if (!entry) return pbId;             // deleted already: silent id
      const pb = { srcId: id, node: null, src: null, vol: volume, loop: !!repeat };
      playbacks.set(pbId, pb);
      entry.playbacks.add(pbId);
      if (entry.buffer !== null || entry.failed) begin(entry, pbId);
      else setTimeout(() => {              // poll decode (no callback hook)
        if (playbacks.has(pbId)) begin(entry, pbId);
      }, 10);
      return pbId;
    },

    audio_source_set_volume(id, volume) {
      const s = sources.get(id);
      if (!s) return;
      s.baseVol = volume;
      for (const pbId of s.playbacks) {
        const pb = playbacks.get(pbId);
        if (pb && pb.node) pb.node.gain.value = pb.vol * volume;
      }
    },

    audio_source_stop(id) {
      const s = sources.get(id);
      if (!s) return;
      for (const pbId of [...s.playbacks]) stopPlayback(pbId);
    },

    audio_source_delete(id) {
      host.audio_source_stop(id);
      sources.delete(id);
    },

    audio_playback_stop(pbId) { stopPlayback(pbId); },

    audio_playback_set_volume(pbId, volume) {
      const pb = playbacks.get(pbId);
      if (!pb) return;
      pb.vol = volume;
      const s = sources.get(pb.srcId);
      if (pb.node && s) pb.node.gain.value = volume * s.baseVol;
    },
  };

  // unlock the shared audio context on first gesture (autoplay policy)
  window.addEventListener("pointerdown", () => { if (audioCtx) audioCtx.resume(); });
  window.addEventListener("keydown", () => { if (audioCtx) audioCtx.resume(); });

  miniquad_add_plugin({
    name: "macroquad_audio",   // matches macroquad_audio_crate_version() == 1
    version: 1,
    register_plugin(imports) { Object.assign(imports.env, host); },
  });
})();
</script>

<script id="sion-audio">
"use strict";
// ---------------------------------------------------------------------------
// libSiON-rs realtime audio: script-processor pumping interleaved f32 stereo
// straight from the wasm staging block (sion_wasm_pump -> ptr into memory).
// ---------------------------------------------------------------------------

const SION_BLOCK_FRAMES = 2048;   // must match audio::BLOCK_FRAMES
const SION_RATE = 44100;          // must match audio::SAMPLE_RATE

let sionAudioStarted = false;
const scratch = new Float32Array(SION_BLOCK_FRAMES * 2);

function sionStartAudio() {
  if (sionAudioStarted) return; sionAudioStarted = true;

  const AC = window.AudioContext || window.webkitAudioContext;
  // pinned rate so the driver never needs resampling glue
  const ctx = new AC({ sampleRate: SION_RATE });

  // unlock from user gesture (autoplay policy); miniquad registers a similar
  // one-shot in its audio plugin - ours targets the main-thread pump
  window.addEventListener("pointerdown", () => ctx.resume());
  window.addEventListener("keydown", () => ctx.resume());

  const node = ctx.createScriptProcessor(SION_BLOCK_FRAMES, 1, 2);
  node.onaudioprocess = (e) => {
    const outL = e.outputBuffer.getChannelData(0);
    const outR = e.outputBuffer.getChannelData(1);

    if (!window.wasm_exports || typeof wasm_exports.sion_wasm_pump !== "function") {
      outL.fill(0); outR.fill(0); return;
    }

    const ptr = wasm_exports.sion_wasm_pump(SION_BLOCK_FRAMES);
    if (!ptr) { outL.fill(0); outR.fill(0); return; }

    // re-view the heap each call: ALLOW_MEMORY_GROWTH reallocates the buffer
    const src = new Float32Array(wasm_memory.buffer, ptr, SION_BLOCK_FRAMES * 2);
    for (let i = 0; i < SION_BLOCK_FRAMES; i++) {
      outL[i] = src[i * 2];
      outR[i] = src[i * 2 + 1];
    }
  };

  node.connect(ctx.destination);
}
window.addEventListener("pointerdown", sionStartAudio);
window.addEventListener("keydown", sionStartAudio);
window.addEventListener("load", () => { try { sionStartAudio(); } catch (e) { console.warn("audio init deferred:", e); } });

// hide the boot overlay once wasm exports exist (frame loop is running)
const bootPoll = setInterval(() => {
  if (window.wasm_exports && wasm_exports.frame) {
    document.getElementById("boot").style.display = "none";
    clearInterval(bootPoll);
  }
}, 250);
</script>

<script>load("title_menu.wasm");</script>
<script>document.getElementById("glcanvas").focus();</script>
</body>
